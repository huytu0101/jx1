; =========================================================================
; BANG CAU HINH QUY TAC NHAN DANG SIMBOT (AN T AUTO - JX1)
; De dang tuy chinh, them ten, phai, tien to hoac mau cua cac he SimBot moi
; File tu dong tai lai khi khoi dong hoac khi co thay doi
; =========================================================================

[General]
; Bat che do nhan dang SimBot da quy tac (1: Bat, 0: Tat)
EnableDynamicSimBot=1

; Tu dong phan don khi bi danh: Neu co bat ky quai/bot nao danh minh thi auto coi la muc tieu
AutoCounterAttack=1

; Coi nguoi choi la mat tren server offline la SimBot (khi khong phai acc minh, party, blacklist)
TreatUnknownPlayerAsSimBot=1

; Mau toi thieu de nhan dien la SimBot (HP < MinSimBotHp se coi la quai thuong)
MinSimBotHp=9000

; Mau toi da cua quai thuong tren bai luyen cong
MaxNormalMonsterHp=15000

; Cho phep nhan dien Kind 0 (NPC/Monster) co ngu hanh va mau cao la SimBot
AllowKind0SimBot=1

; Cho phep nhan dien Npc dang cuoi ngua la SimBot
CheckRidingHorse=1

[Prefixes]
; Cac tien to thuong dung cua SimBot AI / SimBot cac server (phan cach bang dau phay)
; Khong phan biet chu hoa, chu thuong
Prefixes=[tl-,[tv-,[dm-,[nd-,[nm-,[ty-,[cb-,[tn-,[vd-,[cl-,[tl],[tv],[dm],[nd],[nm],[ty],[cb],[tn],[vd],[cl],[volam,[n1-,[n2-,[sim,[bot,[ai,bot_,_bot,sim_,[kim],[tong],[tống]

[Keywords]
; Cac tu khoa ten mon phai hoac dac trung cua SimBot (phan cach bang dau phay)
Keywords=thieu lam,thiếu lâm,thiệu lâm,thien vuong,thiên vương,duong mon,đường môn,đuờng môn,ngu doc,ngũ độc,ngủ độc,nga my,nga mi,thuy yen,thúy yên,thuý yên,cai bang,cái bang,thien nhan,thiên nhẫn,thiên nhẩn,vo dang,võ đang,vỏ đang,con lon,côn lôn,côn sơn,simbot,ai bot,dai hiep,đại hiệp,hiep khach,hiệp khách,thieu hiep,thiếu hiệp

